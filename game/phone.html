<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Prompt Fu Controller</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Titan+One&display=swap" rel="stylesheet">
<script src="js/core.js"></script><script src="js/characters.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#fff8ec;color:#2b2350;font-family:Fredoka,sans-serif;touch-action:none;overscroll-behavior:none}
h1,.t{font-family:'Titan One',cursive;font-weight:400}
#join{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:24px;max-width:480px;margin:auto;touch-action:auto}
#join h1{font-size:44px;margin:0;color:#ff8a3d;text-shadow:3px 3px 0 #2b2350;text-align:center}
#join p{margin:0;text-align:center;opacity:.7}
input,textarea{font:inherit;font-size:18px;padding:14px;border:3px solid #2b2350;border-radius:18px;background:#fff;color:#2b2350;width:100%;-webkit-user-select:text;user-select:text}
textarea{height:76px;resize:none;line-height:1.3}
input,textarea{outline:none;-webkit-appearance:none;appearance:none;box-shadow:0 4px 0 #2b2350;-webkit-tap-highlight-color:transparent;font-size:17px}
input:focus,textarea:focus{border-color:#ff8a3d;box-shadow:0 4px 0 #ff8a3d}
*{-webkit-tap-highlight-color:transparent}
button{font-family:'Titan One',cursive;color:#2b2350;border:4px solid #2b2350;cursor:pointer}
#go{font-size:30px;padding:16px;border-radius:24px;background:#ff8a3d;box-shadow:0 6px 0 #2b2350}
#go:active{transform:translateY(5px);box-shadow:0 1px 0 #2b2350}
#pad{position:fixed;inset:0;display:none;background:radial-gradient(circle at 20% 80%,#e9eaff,#fff8ec 60%)}
#chip{position:fixed;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);padding:6px 16px;border-radius:99px;background:#bdf0d4;border:3px solid #2b2350;font-weight:600;z-index:5;white-space:nowrap}
#chip.off{background:#ffc2d4}
#stick{position:absolute;right:max(6vmin,env(safe-area-inset-right));bottom:7vmin;width:min(42vmin,44vw);aspect-ratio:1;border-radius:50%;background:rgba(166,168,232,.45);border:4px solid rgba(43,35,80,.55)}
#knob{position:absolute;left:50%;top:50%;width:44%;height:44%;margin:-22% 0 0 -22%;border-radius:50%;background:rgba(255,248,236,.9);border:4px solid #2b2350;box-shadow:0 4px 0 #2b2350}
.b{position:absolute;width:min(27vmin,30vw);aspect-ratio:1;border-radius:50%;font-size:min(3.4vmin,14px);display:flex;flex-direction:column;align-items:center;justify-content:center;border:3px solid rgba(43,35,80,.55);box-shadow:0 5px 0 rgba(43,35,80,.45);line-height:1}
.b span{font-size:min(17vmin,70px);line-height:1;filter:drop-shadow(0 3px 0 rgba(43,35,80,.35))}
.b.down{transform:translateY(5px) scale(.94);box-shadow:0 0 0 rgba(43,35,80,.45)}
#bt{background:rgba(255,138,61,.5);left:max(6vmin,env(safe-area-inset-left));bottom:7vmin}
#bd{background:rgba(155,227,192,.5);width:min(22vmin,25vw);left:calc(max(6vmin,env(safe-area-inset-left)) + min(29vmin,32vw));bottom:calc(7vmin + min(19vmin,21vw))}
#bd span{font-size:min(13vmin,54px)}
@media (orientation:portrait){#bd{left:max(6vmin,env(safe-area-inset-left));bottom:calc(10vmin + min(27vmin,30vw))}#stick{bottom:8vmin}}
#turn{position:fixed;top:50%;left:0;right:0;text-align:center;font-weight:600;opacity:.55;pointer-events:none;display:none}
@media (orientation:portrait){#turn{display:block}}
#me{position:fixed;top:max(44px,calc(env(safe-area-inset-top) + 34px));left:0;right:0;display:flex;flex-direction:column;align-items:center;pointer-events:none;z-index:2}
#me canvas{width:110px;height:110px}
#nm{font-family:'Titan One';font-size:20px;line-height:1}
#pips{display:flex;gap:6px;margin-top:4px}#pips i{width:14px;height:14px;border-radius:50%;background:#ddd6ee;border:2px solid #2b2350}#pips i.on{background:#ff8a3d}
#ov{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;font-family:'Titan One';text-align:center;touch-action:none}
#ov.ko{display:flex;background:rgba(255,110,150,.88);color:#fff8ec;font-size:14vw;text-shadow:4px 4px 0 #2b2350;animation:shk .35s infinite}
#ov small{font-family:Fredoka;font-size:20px;font-weight:600;margin-top:10px;text-shadow:none;color:#2b2350}
#ov.win{display:flex;background:rgba(255,226,120,.8);color:#ff6a2d;font-size:14vw;text-shadow:4px 4px 0 #2b2350;pointer-events:none}
@keyframes shk{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(-6px,4px) rotate(-1.5deg)}50%{transform:translate(5px,-5px) rotate(1.5deg)}75%{transform:translate(-4px,-3px) rotate(-1deg)}}
#conf{position:fixed;inset:0;z-index:21;pointer-events:none;width:100%;height:100%}
#msg{position:fixed;top:52px;left:0;right:0;text-align:center;font-weight:600;opacity:.7}
</style></head><body>
<div id="join">
  <h1>Prompt Fu</h1><p>Join the brawl!</p>
  <input id="name" maxlength="16" placeholder="Your name" autocomplete="off">
  <textarea id="prompt" maxlength="300" placeholder="Describe your fighter (optional) - e.g. a grumpy dumpling ninja"></textarea>
  <button id="go">JOIN</button>
</div>
<div id="pad">
  <div id="me"><canvas id="fc" width="220" height="220"></canvas><div id="nm"></div><div id="pips"><i></i><i></i><i></i></div></div><div id="chip" class="off">connecting...</div><div id="msg"></div>
  <div id="turn">📱↻ turn sideways for comfier controls</div>
  <div id="stick"><div id="knob"></div></div>
  <div class="b" id="bt"><span>🪃</span>THROW</div>
  <div class="b" id="bd"><span>💨</span>DASH</div>
<div id="ov"></div><canvas id="conf"></canvas>
</div>
<script>
const $=id=>document.getElementById(id), q=new URLSearchParams(location.search);
const room=(q.get('room')||'').toUpperCase();
const wsUrl=q.get('ws')||((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');
$('name').value=localStorage.pfName||'';
let ws,myName='',myPrompt='',joined=false,mx=0,my=0,th=false,da=false,thPulse=0,daPulse=0;
const buzz=n=>{try{navigator.vibrate&&navigator.vibrate(n)}catch{}};
const send=o=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))};
function connect(){
  ws=new WebSocket(`${wsUrl}?room=${encodeURIComponent(room)}&role=phone`);
  ws.onopen=()=>{$('chip').textContent='connected ✓';$('chip').className='';
    send({type:'join',name:myName}); if(myPrompt)send({type:'fighter',prompt:myPrompt});};
  ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}
    if(m.type==='welcome'&&!m.host){$('chip').textContent='waiting for big screen...';$('chip').className='off'}
    if(m.type==='host'){ if(m.online){$('chip').textContent='connected ✓';$('chip').className='';send({type:'join',name:myName});if(myPrompt)send({type:'fighter',prompt:myPrompt})}
      else{$('chip').textContent='screen offline';$('chip').className='off'}}
    if(m.type==='spec'){ if(m.spec)mySpec=m.spec; if(m.name){myName=m.name;$('nm').textContent=m.name} setWins(m.wins||0) }
    if(m.type==='round'){ $('ov').className='';$('msg').textContent='Round '+m.n+' - FU!' }
    if(m.type==='win'){ setWins(m.wins||0); winFx() }
    if(m.type==='state'){ if(m.msg)$('msg').textContent=m.msg; if(m.hit)buzz([200,60,200]);
      if(m.ko){ $('ov').className='ko';$('ov').innerHTML='BONKED! 💥<small>Bonked! Next round soon</small>' } }};
  ws.onclose=()=>{$('chip').textContent='reconnecting...';$('chip').className='off';setTimeout(connect,1000)};
}
$('go').onclick=()=>{
  if(!room){alert('Missing room code - scan the QR again');return}
  myName=$('name').value.trim()||'Player'; myPrompt=$('prompt').value.trim();
  localStorage.pfName=myName;
  $('join').style.display='none';$('pad').style.display='block';joined=true;buzz(30);
  try{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()}catch{}
  connect();
};
// my fighter + overlays
let mySpec=null,tt=0;const fg=$('fc').getContext('2d');
function setWins(n){[...$('pips').children].forEach((p,k)=>p.className=k<n?'on':'')}
(function loop(){tt+=.05;fg.setTransform(1,0,0,1,0,0);fg.clearRect(0,0,220,220);
  if(mySpec)try{fg.scale(2,2);drawFighter(fg,{spec:mySpec,i:0},55,95+Math.sin(tt*2)*3,1.5,{face:1,step:0,blink:(tt*20)%30<1})}catch(e){}
  requestAnimationFrame(loop)})();
function winFx(){buzz([100,50,100,50,300]);const o=$('ov');o.className='win';o.innerHTML='WINNER! 🏆';
  const c=$('conf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const P=Array.from({length:90},()=>({x:innerWidth/2,y:innerHeight/2,vx:(Math.random()-.5)*16,vy:-Math.random()*16-4,c:['#ff8a3d','#ff7aa8','#7fd8ff','#9be3c0','#fff'][Math.random()*5|0],r:Math.random()*6+4}));
  let n=0;(function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.5;p.x+=p.vx;p.y+=p.vy;x.fillStyle=p.c;x.fillRect(p.x,p.y,p.r,p.r*1.4)});
    if(++n<110)requestAnimationFrame(f);else{x.clearRect(0,0,c.width,c.height);if(o.className==='win')o.className=''}})();}
// joystick
const stick=$('stick'),knob=$('knob');let sid=null;
function move(e){const r=stick.getBoundingClientRect(),R=r.width/2;
  let dx=e.clientX-(r.left+R),dy=e.clientY-(r.top+R);const d=Math.hypot(dx,dy),k=Math.min(1,d/(R*.45)); // full speed at 45% of the pad
  if(d>0){dx/=d;dy/=d}
  mx=+(dx*k).toFixed(2);my=+(dy*k).toFixed(2);if(k<.05){mx=my=0}
  knob.style.transform=`translate(${dx*k*R*.55}px,${dy*k*R*.55}px)`;}
stick.addEventListener('pointerdown',e=>{sid=e.pointerId;stick.setPointerCapture(sid);move(e);e.preventDefault()});
stick.addEventListener('pointermove',e=>{if(e.pointerId===sid)move(e)});
const rel=e=>{if(e.pointerId===sid){sid=null;mx=my=0;knob.style.transform=''}};
stick.addEventListener('pointerup',rel);stick.addEventListener('pointercancel',rel);
// buttons: held state is sent, plus a pulse so a quick tap lasts at least 2 ticks (100ms)
function btn(el,on,off){el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);el.classList.add('down');buzz(25);on();e.preventDefault()});
  const u=e=>{el.classList.remove('down');off()};el.addEventListener('pointerup',u);el.addEventListener('pointercancel',u);}
btn($('bt'),()=>{th=true;thPulse=2},()=>{th=false});
btn($('bd'),()=>{da=true;daPulse=2},()=>{da=false});
setInterval(()=>{if(!joined)return;
  send({type:'input',mx,my,throw:th||thPulse>0,dash:da||daPulse>0});
  if(thPulse>0)thPulse--;if(daPulse>0)daPulse--;},50);
for(const ev of['touchmove','gesturestart','contextmenu'])document.addEventListener(ev,e=>{if(!e.target.closest('#join'))e.preventDefault()},{passive:false});
</script></body></html>
