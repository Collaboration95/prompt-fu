<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Prompt Fu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Titan+One&display=swap" rel="stylesheet">
<style>
  :root { --ink: #2b2350; --cream: #fff8ec; --lav: #a6a8e8; --orange: #ff8a3d; --pink: #ff7aa8; --mint: #7fd8a6; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8fc7a0; font-family: Fredoka, system-ui, sans-serif; color: var(--ink); }
  #c { display: block; width: 100vw; height: 100vh; }
  .roster canvas { width: 60px; height: 60px; }
  .hud { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px; pointer-events: none; }
  .pcard { display: flex; align-items: center; gap: 8px; background: var(--cream); border-radius: 18px; padding: 6px 14px 6px 6px; box-shadow: 0 5px 0 rgba(43, 35, 80, .25); font-weight: 700; transition: transform .2s; }
  .pcard.out { opacity: .45; transform: scale(.92); }
  .pcard canvas { width: 40px; height: 40px; }
  .pips { display: flex; gap: 3px; margin-top: 2px; }
  .pip { width: 9px; height: 9px; border-radius: 50%; background: #ddd6ee; }
  .pip.on { background: var(--orange); }
  .seedbox { position: fixed; bottom: 14px; left: 14px; display: flex; gap: 8px; align-items: center; background: var(--cream); padding: 8px 10px; border-radius: 16px; box-shadow: 0 5px 0 rgba(43, 35, 80, .25); }
  .seedbox input { font: 700 15px Fredoka; border: 2px solid var(--lav); border-radius: 10px; padding: 6px 8px; width: 120px; color: var(--ink); }
  button { font: 700 15px Fredoka; border: 0; border-radius: 12px; padding: 8px 12px; cursor: pointer; background: var(--lav); color: #fff; box-shadow: 0 4px 0 #7c7ec9; }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 #7c7ec9; }
  .keys { position: fixed; bottom: 14px; right: 14px; background: var(--cream); padding: 8px 12px; border-radius: 16px; font-size: 13px; box-shadow: 0 5px 0 rgba(43, 35, 80, .25); }
  .banner { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; }
  .banner .t { font: 400 clamp(48px, 9vw, 120px) "Titan One"; color: #fff; -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; text-shadow: 0 8px 0 var(--ink); transform: scale(0); transition: transform .35s cubic-bezier(.2, 1.6, .4, 1); text-align: center; line-height: 1; }
  .banner .t small { display: block; font-size: .35em; margin-top: 10px; }
  .banner.show .t { transform: scale(1) rotate(-3deg); }
  .title { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(43, 35, 80, .35); backdrop-filter: blur(3px); }
  .title .card { background: var(--cream); border-radius: 32px; padding: 28px 36px; text-align: center; box-shadow: 0 10px 0 rgba(43, 35, 80, .3); max-width: 560px; }
  .title h1 { margin: 0; font: 400 72px/1 "Titan One"; color: var(--orange); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 6px 0 var(--ink); }
  .title p { margin: 10px 0 18px; font-size: 18px; }
  .title .roster { display: flex; justify-content: center; gap: 6px; margin-bottom: 18px; }
  .title button { font-size: 22px; padding: 14px 28px; background: var(--orange); box-shadow: 0 6px 0 #c4602a; }
  .steps { display: flex; justify-content: center; gap: 8px; margin-bottom: 14px; }
  .steps span { font-weight: 700; font-size: 13px; padding: 4px 10px; border-radius: 99px; background: #eee7f7; color: #8a84a8; }
  .steps span.on { background: var(--orange); color: #fff; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 16px 0 6px; }
  .choice { background: #fff; border: 3px solid #e6e0f2; border-radius: 22px; padding: 18px 14px; cursor: pointer; text-align: center; transition: transform .1s, border-color .1s; }
  .choice:hover { transform: translateY(-3px) rotate(-.5deg); border-color: var(--orange); }
  .choice .e { font-size: 40px; display: block; }
  .choice b { font: 400 22px "Titan One"; display: block; margin: 6px 0 2px; }
  .choice small { color: #6b6488; }
  .prompt { display: flex; gap: 8px; margin-top: 12px; }
  .prompt input { flex: 1; font: 600 18px Fredoka; border: 3px solid var(--lav); border-radius: 14px; padding: 12px 14px; color: var(--ink); }
  .prompt button, .go { font-size: 18px; padding: 12px 18px; background: var(--orange); box-shadow: 0 5px 0 #c4602a; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 10px; }
  .chips button { background: #eee7f7; color: var(--ink); box-shadow: none; font-size: 13px; padding: 6px 10px; }
  .preview { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 12px 0; min-height: 110px; }
  .preview canvas { width: 110px; height: 110px; }
  .busy { color: #6b6488; font-weight: 700; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .4; } }
  .row { display: flex; gap: 10px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
  .ghostbtn { background: transparent; color: var(--ink); box-shadow: none; text-decoration: underline; }
  .qrbox { margin-top: 12px; font-size: 14px; color: #6b6488; }
  .qrbox canvas, .qrbox img { width: 120px; height: 120px; image-rendering: pixelated; }
  .vsbig { position: fixed; inset: 0; display: none; grid-template-columns: 1fr auto 1fr; align-items: center; pointer-events: none; }
  .vsbig.show { display: grid; }
  .vsbig .side { height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 6px; font: 400 clamp(28px, 4vw, 54px) "Titan One"; color: #fff; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; }
  .vsbig .side.l { background: linear-gradient(115deg, #ff8a3d, #ff7aa8); clip-path: polygon(0 0, 100% 0, 86% 100%, 0 100%); animation: inL .4s cubic-bezier(.2,1.4,.4,1); }
  .vsbig .side.r { background: linear-gradient(245deg, #7d7fca, #7fd8ff); clip-path: polygon(14% 0, 100% 0, 100% 100%, 0 100%); animation: inR .4s cubic-bezier(.2,1.4,.4,1); }
  .vsbig .side canvas { width: 160px; height: 160px; }
  .vsbig .side small { font-size: .45em; }
  .vsbadge { font: 400 clamp(70px, 11vw, 150px) "Titan One"; color: #ffd23f; -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill; text-shadow: 0 8px 0 var(--ink); margin: 0 -50px; z-index: 2; animation: vsp .7s cubic-bezier(.2,1.8,.4,1); }
  @keyframes inL { from { transform: translateX(-100%); } } @keyframes inR { from { transform: translateX(100%); } } @keyframes vsp { from { transform: scale(3) rotate(-20deg); opacity: 0; } }
  .joinqr { position: fixed; right: 14px; bottom: 64px; background: var(--cream); border-radius: 16px; padding: 8px; text-align: center; font-weight: 700; font-size: 13px; box-shadow: 0 5px 0 rgba(43,35,80,.25); }
  .joinqr:empty { display: none; }
  .joinqr canvas, .joinqr img { width: 110px !important; height: 110px !important; display: block; margin: 0 auto 4px; }
  .hatch { display: flex; flex-direction: column; align-items: center; gap: 8px; margin: 10px 0; }
  .hatch .egg { font-size: 54px; line-height: 1; animation: eggwob .5s ease-in-out infinite; transform-origin: 50% 90%; filter: drop-shadow(0 6px 0 rgba(43,35,80,.2)); }
  .hatch .egg.fast { animation-duration: .18s; }
  @keyframes eggwob { 0%, 100% { transform: rotate(-10deg) scale(1, 1); } 50% { transform: rotate(10deg) scale(1.06, .94); } }
  .hatch .bar { width: 260px; height: 16px; border-radius: 99px; background: #eee7f7; border: 3px solid var(--ink); overflow: hidden; }
  .hatch .bar i { display: block; height: 100%; width: 0; background: repeating-linear-gradient(-45deg, #ff8a3d 0 12px, #ffb066 12px 24px); background-size: 34px 34px; animation: stripes .6s linear infinite; transition: width .25s; }
  @keyframes stripes { to { background-position: 34px 0; } }
  .hatch .msg { font-weight: 700; color: #6b6488; min-height: 22px; }
  .hatch .done { animation: pop .4s cubic-bezier(.2,1.8,.4,1); }
  @keyframes pop { from { transform: scale(.3); } }
  #botpick button { background: #eee7f7; color: var(--ink); box-shadow: 0 3px 0 #cfc6e6; font-size: 15px; padding: 8px 14px; }
  #botpick button.on { background: var(--orange); color: #fff; box-shadow: 0 3px 0 #c4602a; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud" id="hud"></div>
<div class="seedbox"><span>🌱 Arena</span><input id="seed" value="KOPI-42" spellcheck="false"><button id="regen">Generate</button><button id="rand">🎲</button></div>
<div class="keys"><b>P1</b> WASD move · <b>F</b> throw · <b>G</b> dash &nbsp; <b>P2</b> arrows · <b>K</b> throw · <b>L</b> dash</div>
<div class="joinqr" id="joinqr"></div>
<div class="banner" id="banner"><div class="t" id="bannerT"></div></div>
<div class="title" id="title"><div class="card" id="flow"></div></div>
<div class="vsbig" id="vsbig"><div class="side l" id="vsL"></div><div class="vsbadge">VS</div><div class="side r" id="vsR"></div></div>

<script src="js/core.js"></script>
<script src="js/arena.js"></script>
<script src="js/characters.js"></script>
<script src="js/net.js"></script>
<script src="js/awards.js"></script>
<script>
// ---------- Game state ----------
const cv = document.getElementById('c'), g = cv.getContext('2d');
let fighters = [], rangs = [], parts = [], powers = [], shake = 0, hitstop = 0, state = 'title', round = 0, view = { s: 1, ox: 0, oy: 0 };
const keys = {};
let slowT = 0, slowAcc = 0, flash = 0, zoomP = 0, lastInput = performance.now(), attract = false, attractSave = null;
addEventListener('keydown', e => { keys[e.code] = true; if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault(); });
addEventListener('keyup', e => keys[e.code] = false);
const CONTROLS = [{ up: 'KeyW', down: 'KeyS', left: 'KeyA', right: 'KeyD', throw: 'KeyF', dash: 'KeyG' }, { up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight', throw: 'KeyK', dash: 'KeyL' }];

function makeFighter(spec, i, human) {
  return { spec, i, human, x: 0, y: 0, vx: 0, vy: 0, dir: { x: 1, y: 0 }, alive: true, has: true, dashT: 0, dashCd: 0, shield: false, multi: 0, fire: 0, wins: 0, step: 0, ai: { t: 0, path: null } };
}
// Slots: P1 (keyboard) + 3 seats. A seat is a phone/P2 human, a bot (up to BOTS), or empty. Max 4 fighters.
let BOTS = 3;
function applySlots() {
  let bots = 0;
  fighters.forEach((f, i) => { if (i === 0 || f.net || f.human === 1) { f.empty = false; return; } f.empty = bots >= BOTS; if (!f.empty) bots++; if (f.empty) f.alive = false; });
  hud();
}
function resetRound() {
  rangs = []; parts = []; powers = []; applySlots();
  fighters.forEach((f, i) => { const s = spawns[i]; Object.assign(f, { x: s.x, y: s.y, vx: 0, vy: 0, alive: !f.empty, has: true, dashT: 0, dashCd: 0, shield: false, multi: 0, fire: 0 }); });
  powerTimer = 3;
  hud();
}

// ---------- Physics helpers ----------
const solid = (x, y) => { const cx = Math.floor(x / T), cy = Math.floor(y / T); return cx < 0 || cy < 0 || cx >= COLS || cy >= ROWS || (grid[cy][cx] !== 0 && grid[cy][cx] !== 6); };
function moveCircle(o, r) {
  o.x += o.vx; if (solid(o.x + Math.sign(o.vx) * r, o.y - r * .6) || solid(o.x + Math.sign(o.vx) * r, o.y + r * .6)) { o.x -= o.vx; o.vx = 0; }
  o.y += o.vy; if (solid(o.x - r * .6, o.y + Math.sign(o.vy) * r) || solid(o.x + r * .6, o.y + Math.sign(o.vy) * r)) { o.y -= o.vy; o.vy = 0; }
}
function los(a, b) { const d = Math.hypot(b.x - a.x, b.y - a.y), n = Math.ceil(d / 12); for (let k = 1; k < n; k++) if (solid(a.x + (b.x - a.x) * k / n, a.y + (b.y - a.y) * k / n)) return false; return true; }

// ---------- Audio ----------
let AC; function blip(f = 440, d = .08, type = 'square', v = .06) { try { AC = AC || new AudioContext(); const o = AC.createOscillator(), gn = AC.createGain(); o.type = type; o.frequency.value = f * (0.94 + Math.random() * .12); gn.gain.value = v; gn.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + d); o.connect(gn).connect(AC.destination); o.start(); o.stop(AC.currentTime + d); } catch (e) {} }

// ---------- Actions ----------
function throwRang(f) {
  if (!f.alive || !f.has) return;
  PF.stat(f, 'throws');
  const n = f.multi > 0 ? 3 : 1;
  for (let k = 0; k < n; k++) {
    const a = Math.atan2(f.dir.y, f.dir.x) + (k - (n - 1) / 2) * .35;
    rangs.push({ owner: f, x: f.x + Math.cos(a) * 18, y: f.y - 14 + Math.sin(a) * 18, vx: Math.cos(a) * 11, vy: Math.sin(a) * 11, t: 0, back: false, rot: 0, fire: f.fire > 0, main: k === (n - 1) / 2 || n === 1 });
  }
  if (f.multi > 0) f.multi--; f.has = false; blip(660, .07, 'triangle'); f.squash = 1;
}
function dash(f) { if (!f.alive || f.dashCd > 0) return; PF.stat(f, 'dashes'); f.dashT = .16; f.dashCd = .9; blip(220, .1, 'sine', .08); for (let k = 0; k < 6; k++) parts.push({ x: f.x, y: f.y, vx: (Math.random() - .5) * 3, vy: (Math.random() - .5) * 3, life: .4, c: '#fff8ec', r: 5 }); }
function ko(f, by) {
  if (f.shield) { f.shield = false; burst(f.x, f.y - 20, '#7fd8ff', 14); blip(880, .12, 'sine'); return; }
  f.alive = false; PF.stat(f, 'deaths'); if (by) PF.stat(by, 'bonks'); if (f.net && window.NET) NET.send(f.net, { type: 'state', msg: 'Bonked! Next round soon', hit: true, ko: true, respawnIn: Math.max(1, Math.round(roundOverT > 0 ? roundOverT : 3)) }); shake = 14; hitstop = .08; if (state === 'play' && fighters.filter(x => !x.empty).length >= 2 && fighters.filter(x => x.alive).length <= 1) { slowT = .6; flash = .9; zoomP = 1; } blip(120, .25, 'sawtooth', .1); blip(90, .3, 'square', .06);
  burst(f.x, f.y - 20, f.spec.body.color, 24); burst(f.x, f.y - 20, '#fff', 10);
  hud();
}
function burst(x, y, c, n) { for (let k = 0; k < n; k++) { const a = Math.random() * 7, v = 2 + Math.random() * 6; parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 2, life: .6 + Math.random() * .4, c, r: 3 + Math.random() * 5, grav: .25 }); } }

// ---------- Bots ----------
function bfs(sx, sy, tx, ty) {
  const W = COLS, prev = new Int32Array(COLS * ROWS).fill(-1), q = [sy * W + sx]; prev[sy * W + sx] = sy * W + sx;
  while (q.length) { const c = q.shift(); if (c === ty * W + tx) break; const x = c % W, y = (c / W) | 0; for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const a = x + dx, b = y + dy; if (a < 0 || b < 0 || a >= COLS || b >= ROWS || (grid[b][a] && grid[b][a] !== 6) || prev[b * W + a] >= 0) continue; prev[b * W + a] = c; q.push(b * W + a); } }
  if (prev[ty * W + tx] < 0) return null; const path = []; let c = ty * W + tx; while (c !== sy * W + sx) { path.unshift(c); c = prev[c]; } return path;
}
function botThink(f, dt) {
  const foes = fighters.filter(o => o !== f && o.alive && (!inBush(o.x, o.y) || Math.hypot(o.x - f.x, o.y - f.y) < 70)); if (!foes.length) { f.ai.wt = (f.ai.wt || 0) - dt; if (f.ai.wt <= 0) { f.ai.wt = 1; const a = Math.random() * 7; f.ai.wd = { x: Math.cos(a), y: Math.sin(a) }; } return f.ai.wd || { x: 0, y: 0 }; } // hidden foes are ignored beyond 70px
  const tgt = f.has ? foes.sort((a, b) => Math.hypot(a.x - f.x, a.y - f.y) - Math.hypot(b.x - f.x, b.y - f.y))[0] : (rangs.find(r => r.owner === f) || foes[0]);
  f.ai.t -= dt;
  f.ai.cool = (f.ai.cool || 0) - dt; if (f.has && f.ai.cool <= 0 && tgt.alive !== undefined && los(f, tgt) && Math.hypot(tgt.x - f.x, tgt.y - f.y) < 260 && Math.random() < .015) { const err = (Math.random() - .5) * .9, a = Math.atan2(tgt.y - f.y, tgt.x - f.x) + err; f.dir = { x: Math.cos(a), y: Math.sin(a) }; f.ai.cool = 1.2 + Math.random(); throwRang(f); } // dumber: slower, shorter range, wobbly aim
  const danger = rangs.find(r => r.owner !== f && Math.hypot(r.x - f.x, r.y - f.y) < 90); if (danger && Math.random() < .025) dash(f);
  if (f.stuck > .35) { f.ai.wander = { x: Math.random() - .5, y: Math.random() - .5, t: .6 }; f.stuck = 0; f.ai.t = 0; }
  if (f.ai.wander && f.ai.wander.t > 0) { f.ai.wander.t -= dt; return f.ai.wander; }
  if (f.ai.t <= 0) { f.ai.t = .4; f.ai.path = bfs(Math.floor(f.x / T), Math.floor(f.y / T), Math.floor(tgt.x / T), Math.floor(tgt.y / T)); }
  const p = f.ai.path; if (!p || !p.length) return { x: tgt.x - f.x, y: tgt.y - f.y };
  const nx = (p[0] % COLS + .5) * T, ny = ((p[0] / COLS | 0) + .5) * T; if (Math.hypot(nx - f.x, ny - f.y) < 10) p.shift();
  const dd = Math.hypot(tgt.x - f.x, tgt.y - f.y); f.ai.keepT = (f.ai.keepT || 0) - dt;
  if (f.ai.keepT <= 0) { f.ai.keep = f.has && dd < 140 ? -1 : 1; f.ai.keepT = .9; } const keep = f.ai.keep; // sticky decision, no back-and-forth
  return { x: (nx - f.x) * keep, y: (ny - f.y) * keep };
}

// ---------- Update ----------
let powerTimer = 3, last = performance.now(), roundOverT = 0;
function update(dt) {
  if (hitstop > 0) { hitstop -= dt; return; }
  fighters.forEach(f => {
    if (!f.alive) return;
    let ix = 0, iy = 0;
    if (f.net) { const n = netIn[f.net] || {}; ix = n.mx || 0; iy = n.my || 0; if (n.throw && !f.lt) throwRang(f); if (n.dash && !f.ld) dash(f); f.lt = n.throw; f.ld = n.dash; }
    else if (f.human !== undefined && f.human !== null) { const c = CONTROLS[f.human]; ix = (keys[c.right] ? 1 : 0) - (keys[c.left] ? 1 : 0); iy = (keys[c.down] ? 1 : 0) - (keys[c.up] ? 1 : 0); if (keys[c.throw]) { throwRang(f); keys[c.throw] = false; } if (keys[c.dash]) { dash(f); keys[c.dash] = false; } }
    else { const v = botThink(f, dt); ix = v.x; iy = v.y; }
    const m = Math.hypot(ix, iy); if (m > 0) { ix /= m; iy /= m; f.dir = { x: ix, y: iy }; f.step += dt * 14; }
    const bot = !f.net && (f.human === null || f.human === undefined), sp = f.dashT > 0 ? 9 : (bot ? 2.8 : 3.4); f.dashT -= dt; f.dashCd -= dt; f.fire -= dt;
    const acc = f.net ? .55 : .3; f.vx += (ix * sp - f.vx) * acc; f.vy += (iy * sp - f.vy) * acc;
    if (f.dashT > 0) { f.vx = f.dir.x * sp; f.vy = f.dir.y * sp; }
    const ox = f.x, oy = f.y; moveCircle(f, 13);
    if (m > 0 && Math.hypot(f.x - ox, f.y - oy) < .3) { const cx = (Math.floor(f.x / T) + .5) * T, cy = (Math.floor(f.y / T) + .5) * T; f.x += Math.sign(cx - f.x) * 1.2; f.y += Math.sign(cy - f.y) * 1.2; f.stuck = (f.stuck || 0) + dt; } else f.stuck = 0; if (Math.hypot(f.vx, f.vy) > .8) rustleAt(f.x, f.y);
    if (Math.hypot(f.vx, f.vy) > 1.8 && Math.random() < .3 && parts.length < 300) parts.push({ x: f.x + (Math.random() - .5) * 10, y: f.y + 2, vx: -f.vx * .15, vy: -.25, life: .35, c: '#f4ead2', r: 2 + Math.random() * 2 });
    f.squash = (f.squash || 0) * .85; PF.bush(f, dt);
    powers = powers.filter(p => { if (Math.hypot(p.x - f.x, p.y - f.y) < 28) { PF.stat(f, 'powerups'); if (p.kind === 'multi') f.multi = 3; if (p.kind === 'fire') f.fire = 8; if (p.kind === 'shield') f.shield = true; blip(990, .12, 'triangle'); burst(p.x, p.y, '#ffe38a', 12); return false; } return true; });
  });
  rangs.forEach(r => {
    r.t += dt; r.rot += .5;
    if (!r.back && r.t > .55) r.back = true;
    if (r.back) { const o = r.owner, d = Math.hypot(o.x - r.x, o.y - 14 - r.y) || 1; r.vx += ((o.x - r.x) / d * 12 - r.vx) * .12; r.vy += ((o.y - 14 - r.y) / d * 12 - r.vy) * .12; if (d < 22 || !o.alive) { r.dead = true; if (o.alive && r.main) { o.has = true; blip(520, .05, 'triangle', .04); o.squash = 2; for (let k = 0; k < 7; k++) { const a = k * .9; parts.push({ x: o.x, y: o.y - 30, vx: Math.cos(a) * 2.2, vy: Math.sin(a) * 2.2 - 1, life: .45, c: k % 2 ? '#fff6a8' : '#ffffff', r: 2.5 }); } } } }
    const nx = r.x + r.vx, ny = r.y + r.vy;

['keydown', 'pointerdown', 'mousedown', 'touchstart'].forEach(ev => addEventListener(ev, () => { lastInput = performance.now(); if (attract) exitAttract(); }, true));
if (location.search.includes('attract')) lastInput = -1e9;
requestAnimationFrame(loop);
if (location.search.includes('autoplay')) { document.getElementById('title').style.display = 'none'; startRound(); } else flowArena();

// ---------- Phones (WebSocket room via js/net.js) ----------
const netIn = {}; const ROOM = (new URLSearchParams(location.search).get('room') || Math.random().toString(36).slice(2, 6)).toUpperCase();
if (window.NET) try {
  const phoneUrl = NET.connect(null, ROOM);
  const jq = document.getElementById('joinqr'); jq.appendChild(NET.qrCanvas(phoneUrl)); jq.insertAdjacentHTML('beforeend', `📱 Scan to join<br><span style="color:#ff8a3d">ROOM ${escapeHtml(ROOM)}</span>`);
  window.onFlowFighter = box => { box.innerHTML = '<p><b>📱 Or join from your phone</b></p>'; box.appendChild(NET.qrCanvas(phoneUrl)); };
  NET.onJoin((id, name) => {
    const f = fighters.find(f => f.empty && f.human !== 1 && !f.net) || fighters.find(f => f.human === null && !f.net && f !== fighters[0]); if (!f) return NET.send(id, { type: 'state', msg: 'Room full (4 max), next round!' });
    const wasEmpty = f.empty; f.net = id; f.empty = false; if (wasEmpty && state === 'play') { const s = spawns[f.i]; Object.assign(f, { x: s.x, y: s.y, alive: true, has: true }); } f.spec = Object.assign({}, f.spec, { name: (name || 'Snack').slice(0, 12) }); hud(); banner(`${f.spec.name} joined!`, '📱'); blip(990, .12, 'triangle');
    NET.send(id, { type: 'state', msg: `You are ${f.spec.name}!` }); NET.send(id, { type: 'spec', spec: f.spec, name: f.spec.name, wins: f.wins });
  });
  NET.onInput((id, inp) => { netIn[id] = inp; });
  NET.onLeave(id => { const f = fighters.find(f => f.net === id); if (f) { f.net = null; applySlots(); } delete netIn[id]; });
  NET.onFighterPrompt(async (id, prompt) => {
    if (!prompt) return; const f = fighters.find(f => f.net === id); if (!f) return;
    NET.send(id, { type: 'state', msg: '🥚 Hatching your fighter…' });
    try { const spec = await api('/api/fighter', prompt); spec.name = f.spec.name; f.spec = spec; hud(); banner(`${f.spec.name} hatched!`, prompt); NET.send(id, { type: 'state', msg: 'Fighter ready! 🎉' }); NET.send(id, { type: 'spec', spec: f.spec, name: f.spec.name, wins: f.wins }); } catch (e) { NET.send(id, { type: 'state', msg: 'Kitchen busy, using default' }); }
  });
} catch (e) { console.warn('net off', e); }

window.PF = Object.assign(window.PF || {}, { THEME, fighters, genArena, setTheme: t => Object.assign(THEME, t), setFighter: (i, spec) => { fighters[i].spec = spec; hud(); } });
</script>
